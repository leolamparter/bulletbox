project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - Leo
  license: Apache-2.0
  vendor: Bulletbox

assemble:
  jlink:
    bulletbox:
      active: NEVER # Disabling jlink to avoid LWJGL module errors

  jpackage:
    bulletbox:
      active: ALWAYS
      # Removed the jlink link to use the standard runtime
      appVersion: 26.1.1
      icon: icons.ico
      
      mainJar:
        path: "Bulletbox.jar"
      mainClass: Client

      windows:
        console: true
        shortcut: true
        menu: true
        upgradeCode: "bf8a1b5c-48c9-4a9d-b8d4-531637762a12" 

      fileSets:
        - input: "sfx"
          output: "sfx"
        - input: "lib"
          output: "lib"
        - input: "."
          includes:
            - "icons.ico"
            - "alive_leonardocapitan.wav"

packagers:
  exe:
    active: ALWAYS