project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - Leo
  license: Apache-2.0 # Change as needed
  vendor: Bulletbox
  copyright: 2026 Bulletbox

assemble:
  # 1. First, we create a custom JRE (runtime)
  jlink:
    bulletbox:
      active: ALWAYS
      imageName: {{projectName}}-{{projectVersion}}
      executable: bulletbox
      # Point to where your main jar and dependencies are
      modulePaths:
        - "target/libs" 
      additionalModuleNames:
        - java.base
        - java.desktop
        - java.logging
        # Add any other modules your app specifically needs

  # 2. Then, we package that JRE into a Windows Installer
  jpackage:
    bulletbox:
      active: ALWAYS
      jlink: bulletbox # Refers to the jlink section above
      appVersion: 26.1.1
      icon: logo.ico
      
      # This fixes your previous error
      mainJar:
        path: "target/Bulletbox.jar"
      mainClass: Client

      # Windows-specific settings
      windows:
        console: true
        shortcut: true
        menu: true
        # Helps Windows identify the app correctly
        upgradeCode: "bf8a1b5c-48c9-4a9d-b8d4-531637762a12" 

      # Packaging sfx and other resources
      fileSets:
        - input: "sfx"
          output: "sfx"
        - input: "."
          includes:
            - "logo.ico"

# This part tells JReleaser how to name the output files
packagers:
  msi:
    active: ALWAYS
  exe:
    active: ALWAYS