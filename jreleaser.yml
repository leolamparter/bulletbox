project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - leolamparter
  license: Apache-2.0
  vendor: Bulletbox
  copyright: 2025 Bulletbox
  java:
    groupId: bulletbox
  links:
    homepage: https://boxbullet.github.io/boxbullet
    documentation: https://boxbullet.github.io/boxbullet

assemble:
  jpackage:
    bulletbox:
      active: ALWAYS
      mainJar:
        path: Bulletbox.jar
      java:
        mainClass: Client
        jvmOptions:
          universal:
            - "-Xmx2G"
      runtimeImages:
        - path: "{{java.home}}"
          platform: windows-x86_64
      fileSets:
        - input: "."
          includes:
            - "Bulletbox.jar"
            - "icons.ico"
            - "alive_leonardocapitan.wav"
        - input: "lib"
          output: "lib"
        - input: "sfx"
          output: "sfx"
      windows:
        console: true
        shortcut: true
        menu: true
        types:
          - exe
        icon: icons.ico
      osx:
        packageIdentifier: com.bulletbox.client
        packageName: Bulletbox
        icon: icons.icns 
        types:
          - dmg

distributions:
  bulletbox:
    type: NATIVE_PACKAGE
    artifacts:
      - path: "out/jreleaser/assemble/bulletbox/jpackage/{{projectName}}-{{projectVersion}}.exe"
        platform: windows-x86_64