project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - leolamparter
  license: Apache-2.0
  vendor: Bulletbox

assemble:
  jlink:
    bulletbox:
      active: ALWAYS
      imageName: {{projectName}}-{{projectVersion}}
      executable: bulletbox
      # Point to your local lib folder
      modulePaths:
        - "lib" 
      additionalModuleNames:
        - java.base
        - java.desktop
        - java.logging

  jpackage:
    bulletbox:
      active: ALWAYS
      jlink: bulletbox
      appVersion: 26.1.1
      icon: icons.ico # Changed from logo.ico to match your 'ls' output
      
      # Matches the Bulletbox.jar in your root directory
      mainJar:
        path: "Bulletbox.jar"
      mainClass: Client

      windows:
        console: true
        shortcut: true
        menu: true
        upgradeCode: "bf8a1b5c-48c9-4a9d-b8d4-531637762a12" 

      fileSets:
        - input: "sfx"
          output: "sfx"
        - input: "lib"
          output: "lib"
        - input: "."
          includes:
            - "icons.ico"
            - "alive_leonardocapitan.wav"

packagers:
  exe:
    active: ALWAYS