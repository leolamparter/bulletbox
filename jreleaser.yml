project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - leolamparter
  license: Apache-2.0
  vendor: Bulletbox
  links:
    homepage: https://boxbullet.github.io/boxbullet
    documentation: https://boxbullet.github.io/boxbullet

assemble:
  jpackage:
    bulletbox:
      active: ALWAYS
      mainJar:
        path: Bulletbox.jar
      java:
        mainClass: Client
        jvmOptions:
          universal:
            - "-Xmx2G"
      
      # File distribution remains the same
      fileSets:
        - input: "."
          includes:
            - "Bulletbox.jar"
            - "icons.ico"
            - "icons.icns" # Added for Mac
            - "alive_leonardocapitan.wav"
        - input: "lib"
          output: "lib"
        - input: "sfx"
          output: "sfx"

      windows:
        active: ALWAYS
        console: true
        shortcut: true
        menu: true
        types: [exe]
        icon: icons.ico

      osx:
        active: ALWAYS
        packageIdentifier: com.bulletbox.client
        packageName: Bulletbox
        # Mac requires .icns for icons
        icon: icons.icns 
        types: [dmg]

distributions:
  bulletbox:
    type: NATIVE_PACKAGE
    artifacts:
      # JReleaser will automatically find the correct platform artifact
      - path: "out/jreleaser/assemble/bulletbox/jpackage/{{projectName}}-{{projectVersion}}.exe"
        platform: windows-x86_64
      - path: "out/jreleaser/assemble/bulletbox/jpackage/{{projectName}}-{{projectVersion}}.dmg"
        platform: osx-x86_64