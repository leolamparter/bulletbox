project:
  name: bulletbox
  version: 26.1.1
  description: Bulletbox Client
  longDescription: Bulletbox Client Application
  authors:
    - leolamparter
  license: Apache-2.0
  vendor: Bulletbox

assemble:
  jpackage:
    bulletbox:
      active: ALWAYS
      mainJar:
        path: Bulletbox.jar
      java:
        mainClass: Client
        options:
          - "-Xmx2G"

      fileSets:
        - input: "."
          includes:
            - "Bulletbox.jar"
            - "icons.ico"
            - "alive_leonardocapitan.wav"
        - input: "lib"
          output: "lib"
        - input: "sfx"
          output: "sfx"

      windows:
        console: true
        shortcut: true
        menu: true
        types:
          - exe
        upgradeCode: "bf8a1b5c-48c9-4a9d-b8d4-531637762a12"
        icon: icons.ico

distributions:
  bulletbox:
    type: NATIVE_PACKAGE
    artifacts:
      - path: "out/jreleaser/assemble/bulletbox/jpackage/{{projectName}}-{{projectVersion}}.exe"
        platform: windows-x86_64