include required("/stdlib/jdk/25/openjdk.conf")

app {
  display-name = "Bulletbox"
  fsname = "bulletbox"
  rdns-name = "com.yourname.bulletbox"
  vendor = "Your Name"
  version = "1.0.0"

  # The main class inside Bulletbox.jar
  jvm.main-class = "Client" 

  # Include all your files
  inputs = [
    Bulletbox.jar
    lib -> lib
    sfx -> sfx
    fonts -> fonts
    icons.icns
    icons.ico
  ]

  # Tell the JVM where to find your JARs
  jvm.classpath = [
    Bulletbox.jar
    "lib/*.jar"
  ]

  # Important for LWJGL: This tells the app where the native libs are at runtime
  jvm.system-properties {
    java.library.path = lib
  }
}

# Optional: Point to your icon files for each OS
app.mac.icons = icons.icns
app.windows.icons = icons.ico